                      determine the target shard for documents. _(cluster only)_

                      '
                    items:
                      type: string
                    type: array
                  shardingStrategy:
                    description: 'The sharding strategy selected for the collection. _(cluster only)_

                      '
                    enum:
                    - community-compat
                    - enterprise-compat
                    - enterprise-smart-edge-compat
                    - hash
                    - enterprise-hash-smart-edge
                    - enterprise-hex-smart-vertex
                    type: string
                  smartGraphAttribute:
                    description: 'The attribute that is used for sharding: nodes with the same value of

                      this attribute are placed in the same shard. All nodes are required to

                      have this attribute set and it has to be a string. Edges derive the

                      attribute from their connected nodes. _(cluster only)_

                      '
                    type: string
                  smartJoinAttribute:
                    description: 'Determines an attribute of the collection that must contain the shard key value

                      of the referred-to SmartJoin collection. _(cluster only)_

                      '
                    type: string
                  status:
                    description: 'The status of the collection (deprecated).

                      - `3`: loaded

                      - `5`: deleted


                      Every other status indicates a corrupted collection.

                      '
                    example: 3
                    type: integer
                  statusString:
                    description: 'The status of the collection as a descriptive string (deprecated).

                      '
                    enum:
                    - loaded
                    - deleted
                    example: loaded
                    type: string
                  syncByRevision:
                    description: 'Whether the newer revision-based replication protocol is

                      enabled for this collection. This is an internal property.

                      '
                    type: boolean
                  type:
                    description: "The type of the collection:\n  - `0`: \"unknown\"\n  - `2`: regular document collection\n  - `3`: edge collection\n"
                    type: integer
                  waitForSync:
                    description: 'If `true`, creating, changing, or removing

                      documents waits until the data has been synchronized to disk.

                      '
                    type: boolean
                  writeConcern:
                    description: 'Determines how many copies of each shard are required to be

                      in-sync on the different DB-Servers. If there are less than these many copies

                      in the cluster, a shard refuses to write. Writes to shards with enough

                      up-to-date copies succeed at the same time, however. The value of

                      `writeConcern` cannot be greater than `replicationFactor`.


                      If `distributeShardsLike` is set when the collection is created,

                      the initial `writeConcern` defaults to that of the indicated

                      prototype collection. Afterwards, `writeConcern` is independent

                      from the prototype collection and can differ from it.


                      For SatelliteCollections, the `writeConcern` is automatically controlled to

                      equal the number of DB-Servers and has a value of `0`.

                      Otherwise, the default value is controlled by the current database''s

                      default `writeConcern`, which uses the `--cluster.write-concern`

                      startup option as default, which defaults to `1`. _(cluster only)_

                      '
                    type: integer
                required:
                - count
                - error
                - code
                - name
                - type
                - status
                - statusString
                - isSystem
                - id
                - globallyUniqueId
                - waitForSync
                - keyOptions
                - schema
                - computedValues
                - cacheEnabled
                - syncByRevision
                type: object
          description: 'All properties of the collection but additionally the document `count`.

            '
        '400':
