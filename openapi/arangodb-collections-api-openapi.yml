        The unload function is deprecated from version 3.8.0 onwards and is a no-op

        from version 3.9.0 onwards. It should no longer be used and is removed

        in ArangoDB v4.0.



        Since ArangoDB version 3.9.0 this API does nothing. Previously it used to

        unload a collection from memory, while preserving all documents.

        '
      operationId: unloadCollection
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The name of the collection.


          > **WARNING:**

          Accessing collections by their numeric ID is deprecated from version 3.4.0 on.

          You should reference them via their names instead.

          '
        in: path
        name: collection-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  globallyUniqueId:
                    description: 'A unique identifier of the collection. This is an internal property.

                      '
                    type: string
                  id:
                    description: 'A unique identifier of the collection (deprecated).

                      '
                    type: string
                  isSystem:
                    description: 'Whether the collection is a system collection. Collection names that starts with

                      an underscore are usually system collections.

                      '
                    example: false
                    type: boolean
                  name:
                    description: 'The name of the collection.

                      '
                    example: coll
                    type: string
                  status:
                    description: 'The status of the collection.

                      - `3`: loaded

                      - `5`: deleted


                      Every other status indicates a corrupted collection.

                      '
                    example: 3
                    type: integer
                  type:
                    description: 'The type of the collection:

                      - `0`: "unknown"

                      - `2`: regular document collection

                      - `3`: edge collection

