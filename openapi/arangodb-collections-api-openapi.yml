  /_db/{database-name}/_api/collection/{collection-name}/truncate:
    put:
      description: 'Removes all documents from the collection, but leaves the indexes intact.

        '
      operationId: truncateCollection
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The name of the collection.


          > **WARNING:**

          Accessing collections by their numeric ID is deprecated from version 3.4.0 on.

          You should reference them via their names instead.

          '
        in: path
        name: collection-name
        required: true
        schema:
          type: string
      - description: 'If set to `true`, the data is synchronized to disk before returning from the

          truncate operation.

          '
        in: query
        name: waitForSync
        required: false
        schema:
          default: false
          type: boolean
      - description: 'If set to `true`, the storage engine is told to start a compaction

          in order to free up disk space. This can be resource intensive. If the only

          intention is to start over with an empty collection, specify `false`.

          '
        in: query
        name: compact
        required: false
        schema:
          default: true
          type: boolean
      - description: 'To make this operation a part of a Stream Transaction, set this header to the

          transaction ID returned by the `POST /_api/transaction/begin` call.

          '
        in: header
        name: x-arango-trx-id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  id:
                    description: 'A unique identifier of the collection (deprecated).

                      '
                    type: string
                required:
                - error
                - code
                - id
                type: object
          description: 'Truncating the collection was successful.

            Returns the basic information about the collection.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The `collection-name` parameter is missing.

            '
        '404':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 404
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The collection cannot be found.


            This error also occurs if you try to run this operation as part of a

            Stream Transaction but the transaction ID specified in the

            `x-arango-trx-id` header is unknown to the server.

            '
        '410':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 410
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'This error occurs if you try to run this operation as part of a

            Stream Transaction that has just been canceled or timed out.

            '
      summary: Truncate a collection
      tags:
      - Collections
  /_db/{database-name}/_api/collection/{collection-name}/unload:
    put:
