  /_db/{database-name}/_api/collection/{collection-name}/checksum:
    get:
      description: 'Calculates a checksum of the meta-data (keys and optionally revision ids) and

        optionally the document data in the collection.


        The checksum can be used to compare if two collections on different ArangoDB

        instances contain the same contents. The current revision of the collection is

        returned too so one can make sure the checksums are calculated for the same

        state of data.


        By default, the checksum is only calculated on the `_key` system attribute

        of the documents contained in the collection. For edge collections, the system

        attributes `_from` and `_to` are also included in the calculation.


        By setting the optional query parameter `withRevisions` to `true`, then revision

        IDs (`_rev` system attributes) are included in the checksumming.


        By providing the optional query parameter `withData` with a value of `true`,

        the user-defined document attributes are included in the calculation, too.


        > **INFO:**

        Including user-defined attributes will make the checksumming slower.

        '
      operationId: getCollectionChecksum
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The name of the collection.


          > **WARNING:**

          Accessing collections by their numeric ID is deprecated from version 3.4.0 on.

          You should reference them via their names instead.

          '
        in: path
        name: collection-name
        required: true
        schema:
          type: string
      - description: 'Whether to include document revision ids in the checksum calculation.

          '
        in: query
        name: withRevisions
        required: false
        schema:
          default: false
          type: boolean
      - description: 'Whether to include document body data in the checksum calculation.

          '
        in: query
        name: withData
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  checksum:
                    description: 'The calculated checksum as a number.

                      '
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  globallyUniqueId:
                    description: 'A unique identifier of the collection. This is an internal property.

                      '
                    type: string
                  id:
                    description: 'A unique identifier of the collection (deprecated).

                      '
                    type: string
                  isSystem:
                    description: 'Whether the collection is a system collection. Collection names that starts with

                      an underscore are usually system collections.

                      '
                    example: false
                    type: boolean
                  name:
                    description: 'The name of the collection.

                      '
                    example: coll
                    type: string
                  revision:
                    description: 'The collection revision id as a string.

                      '
                  status:
                    description: 'The status of the collection.

                      - `3`: loaded

                      - `5`: deleted


                      Every other status indicates a corrupted collection.

                      '
                    example: 3
                    type: integer
                  type:
                    description: 'The type of the collection:

                      - `0`: "unknown"

                      - `2`: regular document collection

                      - `3`: edge collection

                      '
                    example: 2
                    type: integer
                required:
                - checksum
                - revision
                - error
                - code
                - id
                - name
                - status
                - type
                - isSystem
                - globallyUniqueId
                type: object
          description: 'The basic information about the collection but additionally the

            collection `checksum` and `revision`.

            '
        '400':
          description: 'If the `collection-name` placeholder is missing, then a *HTTP 400* is

            returned.

            '
        '404':
          description: 'If the collection is unknown, then a *HTTP 404*

            is returned.

            '
      summary: Get the collection checksum
      tags:
      - Collections
