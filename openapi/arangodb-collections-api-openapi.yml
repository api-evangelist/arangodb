                      - `5`: deleted


                      Every other status indicates a corrupted collection.

                      '
                    example: 3
                    type: integer
                  type:
                    description: 'The type of the collection:

                      - `0`: "unknown"

                      - `2`: regular document collection

                      - `3`: edge collection

                      '
                    example: 2
                    type: integer
                required:
                - error
                - code
                - name
                - type
                - isSystem
                - status
                - id
                - globallyUniqueId
                type: object
          description: 'The compaction has been started successfully.

