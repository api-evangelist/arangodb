            overload or temporary failure. In this case it makes sense to retry the request

            later.


            If the error code is `1429`, then the write concern for the collection cannot be

            fulfilled. This can happen if less than the number of specified replicas for

            a shard are currently in-sync with the leader. For example, if the write concern

            is `2` and the replication factor is `3`, then the write concern is not fulfilled

            if two replicas are not in-sync.


            Note that the HTTP status code is configurable via the

            `--cluster.failed-write-concern-status-code` startup option. It defaults to `403`

            but can be changed to `503` to signal client applications that it is a

            temporary error.

            '
      summary: Remove a document
      tags:
      - Documents
    get:
      description: 'Returns the document identified by the collection name and document key.

        The returned document contains three special attributes:

        - `_id`, containing the document identifier with the format `<collection-name>/<document-key>`.

        - `_key`, containing the document key that uniquely identifies a document within the collection.

        - `_rev`, containing the document revision.

        '
      operationId: getDocument
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'Name of the collection from which the document is to be read.

          '
        in: path
        name: collection
        required: true
        schema:
          type: string
      - description: 'The document key.

          '
        in: path
        name: key
        required: true
        schema:
          type: string
      - description: 'If the `If-None-Match` header is given, then it must contain exactly one

          ETag. The document is returned, if it has a different revision than the

          given ETag. Otherwise an *HTTP 304* is returned.

          '
        in: header
        name: If-None-Match
        required: false
        schema:
          type: string
      - description: 'If the `If-Match` header is given, then it must contain exactly one

          ETag. The document is returned, if it has the same revision as the

          given ETag. Otherwise a *HTTP 412* is returned.

          '
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      - description: 'Set this header to `true` to allow the Coordinator to ask any shard replica for

          the data, not only the shard leader. This may result in "dirty reads".


          The header is ignored if this operation is part of a Stream Transaction

          (`x-arango-trx-id` header). The header set when creating the transaction decides

          about dirty reads for the entire transaction, not the individual read operations.

          '
        in: header
        name: x-arango-allow-dirty-read
        required: false
        schema:
          type: boolean
      - description: 'To make this operation a part of a Stream Transaction, set this header to the

          transaction ID returned by the `POST /_api/transaction/begin` call.

          '
        in: header
        name: x-arango-trx-id
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'The document has been found.

            '
        '304':
          description: 'The `If-None-Match` header is specified and the document

            has the same revision.

            '
        '404':
          description: 'The document or collection cannot be found.


            This error also occurs if you try to run this operation as part of a

            Stream Transaction but the transaction ID specified in the

            `x-arango-trx-id` header is unknown to the server.

            '
        '410':
          description: 'This error occurs if you try to run this operation as part of a

            Stream Transaction that has just been canceled or timed out.

            '
        '412':
          description: 'An `If-Match` header is specified and the found

            document has a different revision. The response includes the found

            document''s current revision in the `_rev` attribute. Additionally, the

            `_id` and `_key` attributes are returned.

            '
      summary: Get a document
      tags:
      - Documents
    head:
      description: 'Like `GET`, but only returns the header fields and not the body. You

        can use this call to get the current revision of a document or check if

        the document was deleted.

