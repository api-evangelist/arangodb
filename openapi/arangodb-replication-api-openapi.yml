  /_db/{database-name}/_api/replication/make-follower:
    put:
      description: '> **WARNING:**

        Calling this endpoint will synchronize data from the collections found on the

        remote leader to the local ArangoDB database.'
      operationId: makeReplicationFollower
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                adaptivePolling:
                  description: 'whether or not the replication applier will use adaptive polling.

                    '
                  type: boolean
                autoResync:
                  description: 'whether or not the follower should perform an automatic resynchronization with

                    the leader in case the leader cannot serve log data requested by the follower,

                    or when the replication is started and no tick value can be found.

                    '
                  type: boolean
                autoResyncRetries:
                  description: 'number of resynchronization retries that will be performed in a row when

                    automatic resynchronization is enabled and kicks in. Setting this to `0` will

                    effectively disable `autoResync`. Setting it to some other value will limit

                    the number of retries that are performed. This helps preventing endless retries

                    in case resynchronizations always fail.

                    '
                  type: integer
                chunkSize:
                  description: 'the requested maximum size for log transfer packets that

                    is used when the endpoint is contacted.

                    '
                  type: integer
                connectTimeout:
                  description: 'the timeout (in seconds) when attempting to connect to the

                    endpoint. This value is used for each connection attempt.

                    '
                  type: integer
                connectionRetryWaitTime:
                  description: 'the time (in seconds) that the applier will intentionally idle before

                    it retries connecting to the leader in case of connection problems.

                    This value will be ignored if set to `0`.

                    '
                  type: integer
                database:
                  description: 'the database name on the leader (if not specified, defaults to the

                    name of the local current database).

                    '
                  type: string
                endpoint:
                  description: 'the leader endpoint to connect to (e.g. "tcp://192.168.173.13:8529").

                    '
                  type: string
                idleMaxWaitTime:
                  description: 'the maximum wait time (in seconds) that the applier will intentionally idle

                    before fetching more log data from the leader in case the leader has

                    already sent all its log data and there have been previous log fetch attempts

                    that resulted in no more log data. This wait time can be used to control the

                    maximum frequency with which the replication applier sends HTTP log fetch

                    requests to the leader in case there is no write activity on the leader for

                    longer periods. This configuration value will only be used if the option

                    `adaptivePolling` is set to `true`.

                    This value will be ignored if set to `0`.

                    '
                  type: integer
                idleMinWaitTime:
                  description: 'the minimum wait time (in seconds) that the applier will intentionally idle

                    before fetching more log data from the leader in case the leader has

                    already sent all its log data. This wait time can be used to control the

                    frequency with which the replication applier sends HTTP log fetch requests

                    to the leader in case there is no write activity on the leader.

                    This value will be ignored if set to `0`.

                    '
                  type: integer
                includeSystem:
                  description: 'whether or not system collection operations will be applied

                    '
                  type: boolean
                initialSyncMaxWaitTime:
                  description: 'the maximum wait time (in seconds) that the initial synchronization will

                    wait for a response from the leader when fetching initial collection data.

                    This wait time can be used to control after what time the initial synchronization

                    will give up waiting for a response and fail. This value is relevant even

                    for continuous replication when `autoResync` is set to `true` because this

                    may re-start the initial synchronization when the leader cannot provide

                    log data the follower requires.

                    This value will be ignored if set to `0`.

                    '
                  type: integer
                maxConnectRetries:
                  description: 'the maximum number of connection attempts the applier

                    will make in a row. If the applier cannot establish a connection to the

                    endpoint in this number of attempts, it will stop itself.

                    '
                  type: integer
                password:
                  description: 'the password to use when connecting to the leader.

                    '
                  type: string
                requestTimeout:
                  description: 'the timeout (in seconds) for individual requests to the endpoint.

                    '
                  type: integer
                requireFromPresent:
                  description: 'if set to `true`, then the replication applier will check

                    at start of its continuous replication if the start tick from the dump phase

                    is still present on the leader. If not, then there would be data loss. If

                    `requireFromPresent` is `true`, the replication applier will abort with an

                    appropriate error message. If set to `false`, then the replication applier will

                    still start, and ignore the data loss.

                    '
                  type: boolean
                restrictCollections:
                  description: 'an optional array of collections for use with `restrictType`.

                    If `restrictType` is `include`, only the specified collections

                    will be synchronized. If `restrictType` is `exclude`, all but the specified

                    collections will be synchronized.

                    '
                  items:
                    type: string
                  type: array
                restrictType:
                  description: 'an optional string value for collection filtering. When

                    specified, the allowed values are `include` or `exclude`.

                    '
                  type: string
                username:
                  description: 'an optional ArangoDB username to use when connecting to the leader.

                    '
                  type: string
                verbose:
                  description: 'if set to `true`, then a log line will be emitted for all operations

                    performed by the replication applier. This should be used for debugging

                    replication

                    problems only.

                    '
                  type: boolean
              required:
              - endpoint
              - database
              - password
              - includeSystem
              type: object
      responses:
        '200':
          description: 'is returned if the request was executed successfully.

            '
        '400':
          description: 'is returned if the configuration is incomplete or malformed.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred during synchronization or when starting the

            continuous replication.

            '
        '501':
          description: 'is returned when this operation is called on a Coordinator in a cluster deployment.

            '
      summary: Turn a server into a follower of another
      tags:
      - Replication
  /_db/{database-name}/_api/replication/revisions/documents:
    put:
      description: '> **WARNING:**

        This revision-based replication endpoint will only work with collections

        created in ArangoDB v3.8.0 or later.


        Returns documents by revision for replication.


        The body of the request should be JSON/VelocyPack and should consist of an

        array of string-encoded revision IDs:


        ```

        [

        ,

        ,

        ...


        ]

        ```


        In particular, the revisions should be sorted in ascending order of their

        decoded values.


        The result will be a JSON/VelocyPack array of document objects. If there is no

        document corresponding to a particular requested revision, an empty object will

        be returned in its place.


        The response may be truncated if it would be very long. In this case, the

        response array length will be less than the request array length, and

        subsequent requests can be made for the omitted documents.


        Each `` value type is a 64-bit value encoded as a string of

        11 characters, using the same encoding as our document `_rev` values. The

        reason for this is that 64-bit values cannot necessarily be represented in full

        in JavaScript, as it handles all numbers as floating point, and can only

        represent up to `2^53-1` faithfully.'
      operationId: listReplicationRevisionDocuments
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The name or id of the collection to query.

          '
        in: query
        name: collection
        required: true
        schema:
          type: string
      - description: 'The id of the snapshot to use

          '
        in: query
        name: batchId
        required: true
        schema:
          type: number
      responses:
        '200':
          description: 'is returned if the request was executed successfully and data was returned.

            '
        '401':
          description: 'is returned if necessary parameters are missing or incorrect

            '
        '404':
          description: 'is returned when the collection or snapshot could not be found.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred while assembling the response.

            '
        '501':
          description: 'is returned if called on a collection which doesn''t support sync-by-revision

            '
      summary: Get documents by revision
      tags:
      - Replication
  /_db/{database-name}/_api/replication/revisions/ranges:
    put:
      description: '> **WARNING:**

        This revision-based replication endpoint will only work with the RocksDB

        engine, and with collections created in ArangoDB v3.8.0 or later.


        Returns the revision IDs of documents within the requested ranges.


        The body of the request should be JSON/VelocyPack and should consist of an

        array of pairs of string-encoded revision IDs:


        ```

        [

        [, ],

        [, ],

        ...

        [, ]

        ]

        ```


        In particular, the pairs should be non-overlapping, and sorted in ascending

        order of their decoded values.


        The result will be JSON/VelocyPack in the following format:

        ```

        {

        ranges: [

        [, , ... ],

        [, , ... ],

        ...,

        [, , ... ]

        ]

        resume:

        }

        ```


        The `resume` field is optional. If specified, then the response is to be

        considered partial, only valid through the revision specified. A subsequent

        request should be made with the same request body, but specifying the `resume`

        URL parameter with the value specified. The subsequent response will pick up

        from the appropriate request pair, and omit any complete ranges or revisions

        which are less than the requested resume revision. As an example (ignoring the

        string-encoding for a moment), if ranges `[1, 3], [5, 9], [12, 15]` are

        requested, then a first response may return `[], [5, 6]` with a resume point of

        `7` and a subsequent response might be `[8], [12, 13]`.


        If a requested range contains no revisions, then an empty array is returned.

        Empty ranges will not be omitted.


        Each `` value type is a 64-bit value encoded as a string of

        11 characters, using the same encoding as our document `_rev` values. The

        reason for this is that 64-bit values cannot necessarily be represented in full

        in JavaScript, as it handles all numbers as floating point, and can only

        represent up to `2^53-1` faithfully.'
      operationId: listReplicationRevisionRanges
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The name or id of the collection to query.

          '
        in: query
        name: collection
        required: true
        schema:
          type: string
      - description: 'The id of the snapshot to use

          '
        in: query
        name: batchId
        required: true
        schema:
          type: number
      - description: 'The revision at which to resume, if a previous request was truncated

          '
        in: query
        name: resume
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'is returned if the request was executed successfully and data was returned.

            '
        '401':
          description: 'is returned if necessary parameters are missing or incorrect

            '
        '404':
          description: 'is returned when the collection or snapshot could not be found.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred while assembling the response.

            '
        '501':
          description: 'is returned if called on a collection which doesn''t support sync-by-revision

            '
      summary: List document revision IDs within requested ranges
      tags:
      - Replication
  /_db/{database-name}/_api/replication/revisions/tree:
    get:
      description: '> **WARNING:**

        This revision-based replication endpoint will only work with collections

        created in ArangoDB v3.8.0 or later.


        Returns the Merkle tree associated with the specified collection.


        The result will be JSON/VelocyPack in the following format:

        ```

        {

        version: ,

        branchingFactor:

        maxDepth: ,

        rangeMin: ,

        rangeMax: ,

        nodes: [

        { count: , hash: },

        { count: , hash: },

        ...

        { count: , hash: }

        ]

        }

        ```


        At the moment, there is only one version, 1, so this can safely be ignored for

        now.


        Each `` value type is a 64-bit value encoded as a string of

        11 characters, using the same encoding as our document `_rev` values. The

        reason for this is that 64-bit values cannot necessarily be represented in full

        in JavaScript, as it handles all numbers as floating point, and can only

        represent up to `2^53-1` faithfully.


        The node count should correspond to a full tree with the given `maxDepth` and

        `branchingFactor`. The nodes are laid out in level-order tree traversal, so the

        root is at index `0`, its children at indices `[1, branchingFactor]`, and so

        on.'
      operationId: getReplicationRevisionTree
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The name or id of the collection to query.

          '
        in: query
        name: collection
        required: true
        schema:
          type: string
      - description: 'The id of the snapshot to use

          '
        in: query
        name: batchId
        required: true
        schema:
          type: number
      responses:
        '200':
          description: 'is returned if the request was executed successfully and data was returned.

            '
        '401':
          description: 'is returned if necessary parameters are missing

            '
        '404':
          description: 'is returned when the collection or snapshot could not be found.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred while assembling the response.

            '
        '501':
          description: 'is returned if called on a collection which doesn''t support sync-by-revision

            '
      summary: Get the replication revision tree
      tags:
      - Replication
    post:
      description: '> **WARNING:**

        This revision-based replication endpoint will only work with collections

        created in ArangoDB v3.8.0 or later.


        Rebuilds the Merkle tree for a collection.


        If successful, there will be no return body.'
      operationId: rebuildReplicationRevisionTree
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The name or id of the collection to query.

          '
        in: query
        name: collection
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 'is returned if the request was executed successfully.

            '
        '401':
          description: 'is returned if necessary parameters are missing

            '
        '404':
          description: 'is returned when the collection or could not be found.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred while assembling the response.

            '
        '501':
          description: 'is returned if called on a collection which doesn''t support sync-by-revision

            '
      summary: Rebuild the replication revision tree
      tags:
      - Replication
  /_db/{database-name}/_api/replication/server-id:
    get:
      description: 'Returns the servers id. The id is also returned by other replication API

        methods, and this method is an easy means of determining a server''s id.


        The body of the response is a JSON object with the attribute `serverId`. The

        server id is returned as a string.'
      operationId: getReplicationServerId
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'is returned if the request was executed successfully.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred while assembling the response.

            '
      summary: Get the replication server ID
      tags:
      - Replication
  /_db/{database-name}/_api/replication/sync:
    put:
      description: 'Starts a full data synchronization from a remote endpoint into the local

        ArangoDB database.


        The *sync* method can be used by replication clients to connect an ArangoDB database

        to a remote endpoint, fetch the remote list of collections and indexes, and collection

        data. It will thus create a local backup of the state of data at the remote ArangoDB

        database. *sync* works on a per-database level.


        *sync* will first fetch the list of collections and indexes from the remote endpoint.

        It does so by calling the *inventory* API of the remote database. It will then purge

        data in the local ArangoDB database, and after start will transfer collection data

        from the remote database to the local ArangoDB database. It will extract data from the

        remote database by calling the remote database''s *dump* API until all data are fetched.


        In case of success, the body of the response is a JSON object with the following

        attributes:


        - *collections*: an array of collections that were transferred from the endpoint


        - *lastLogTick*: the last log tick on the endpoint at the time the transfer

        was started. Use this value as the *from* value when starting the continuous

        synchronization later.


        WARNING: calling this method will synchronize data from the collections found

        on the remote endpoint to the local ArangoDB database. All data in the local

        collections will be purged and replaced with data from the endpoint.


        Use with caution!


        > **INFO:**

        This method is not supported on a Coordinator in a cluster deployment.'
      operationId: startReplicationSync
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                database:
                  description: 'the database name on the leader (if not specified, defaults to the

                    name of the local current database).

                    '
                  type: string
                endpoint:
                  description: 'the leader endpoint to connect to (e.g. "tcp://192.168.173.13:8529").

                    '
                  type: string
                includeSystem:
                  description: 'whether or not system collection operations will be applied

                    '
                  type: boolean
                incremental:
                  description: 'if set to *true*, then an incremental synchronization method will be used

                    for synchronizing data in collections. This method is useful when

                    collections already exist locally, and only the remaining differences need

                    to be transferred from the remote endpoint. In this case, the incremental

                    synchronization can be faster than a full synchronization.

                    The default value is *false*, meaning that the complete data from the remote

                    collection will be transferred.

                    '
                  type: boolean
                initialSyncMaxWaitTime:
                  description: 'the maximum wait time (in seconds) that the initial synchronization will

                    wait for a response from the leader when fetching initial collection data.

                    This wait time can be used to control after what time the initial synchronization

                    will give up waiting for a response and fail.

                    This value will be ignored if set to *0*.

                    '
                  type: integer
                password:
                  description: 'the password to use when connecting to the endpoint.

                    '
                  type: string
                restrictCollections:
                  description: 'an optional array of collections for use with

                    *restrictType*. If *restrictType* is *include*, only the specified collections

                    will be synchronized. If *restrictType* is *exclude*, all but the specified

                    collections will be synchronized.

                    '
                  items:
                    type: string
                  type: array
                restrictType:
                  description: 'an optional string value for collection filtering. When

                    specified, the allowed values are *include* or *exclude*.

                    '
                  type: string
                username:
                  description: 'an optional ArangoDB username to use when connecting to the endpoint.

                    '
                  type: string
              required:
              - endpoint
              - password
              type: object
      responses:
        '200':
          description: 'is returned if the request was executed successfully.

            '
        '400':
          description: 'is returned if the configuration is incomplete or malformed.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred during synchronization.

            '
        '501':
          description: 'is returned when this operation is called on a Coordinator in a cluster deployment.

            '
      summary: Start replication from a remote endpoint
      tags:
      - Replication
  /_db/{database-name}/_api/wal/lastTick:
    get:
      description: 'Returns the last available tick value that can be served from the server''s

        replication log. This corresponds to the tick of the latest successful operation.


        The result is a JSON object containing the attributes `tick`, `time` and `server`.

        - `tick`: contains the last available tick, `time`

        - `time`: the server time as string in format `YYYY-MM-DDTHH:MM:SSZ`

        - `server`: An object with fields `version` and `serverId`


        > **INFO:**

        This method is not supported on a Coordinator in a cluster deployment.'
      operationId: getWalLastTick
      parameters:
      - description: 'The name of a database. The user account you authenticate with needs

          at least read access to this database and administrate access to the

          `_system` database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'is returned if the request was executed successfully.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred while assembling the response.

            '
        '501':
          description: 'is returned when this operation is called on a Coordinator in a cluster deployment.

            '
      summary: Get the last available tick value
      tags:
      - Replication
  /_db/{database-name}/_api/wal/range:
    get:
      description: 'Returns the currently available ranges of tick values for all Write-Ahead Log

        (WAL) files. The tick values can be used to determine if certain

        data (identified by tick value) are still available for replication.


        The body of the response contains a JSON object.

        - `tickMin`: minimum tick available

        - `tickMax`: maximum tick available

        - `time`: the server time as string in format `YYYY-MM-DDTHH:MM:SSZ`

        - `server`: An object with fields `version` and `serverId`'
      operationId: getWalRange
      parameters:
      - description: 'The name of a database. The user account you authenticate with needs

          at least read access to this database and administrate access to the

          `_system` database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'is returned if the tick ranges could be determined successfully.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if the server operations state could not be determined.

            '
        '501':
          description: 'is returned when this operation is called on a Coordinator in a cluster deployment.

            '
      summary: Get the tick ranges available in the WAL
      tags:
      - Replication
  /_db/{database-name}/_api/wal/tail:
    get:
      description: Returns data from the server's write-ahead log (also named replication log).
      operationId: getWalTail
      parameters:
      - description: 'The name of a database. The user account you authenticate with needs

          at least read access to this database and administrate access to the

          `_system` database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'Whether operations for all databases should be included. If set to `false`,

          only the operations for the current database are included. The value `true` is

          only valid on the `_system` database.

          '
        in: query
        name: global
        required: false
        schema:
          default: false
          type: boolean
      - description: 'Exclusive lower bound tick value for results. On successive calls

          to this API you should set this to the value returned

          with the `x-arango-replication-lastincluded` header (unless that header

          contains 0).

          '
        in: query
        name: from
        required: false
        schema:
          type: number
      - description: 'Inclusive upper bound tick value for results.

          '
        in: query
        name: to
        required: false
        schema:
          type: number
      - description: 'Should be set to the value of the `x-arango-replication-lastscanned` header

          or alternatively `0` on the first try. This allows the RocksDB storage engine to break up

          large transactions over multiple responses.

          '
        in: query
        name: lastScanned
        required: false
        schema:
          type: number
      - description: 'Approximate maximum size of the returned result.

          '
        in: query
        name: chunkSize
        required: false
        schema:
          type: number
      - description: 'The ID of the client used to tail results. The server uses this to

          keep operations until the client has fetched them. Must be a positive integer.

          > **INFO:**

          Either `syncerId` or `serverId` is required to fetch all operations.

          '
        in: query
        name: syncerId
        required: false
        schema:
          type: number
      - description: 'The ID of the client machine. If `syncerId` is unset, the server uses

          this to keep operations until the client has fetched them. Must be a positive

          integer.

          > **INFO:**

          Either `syncerId` or `serverId` is required to fetch all operations.

          '
        in: query
        name: serverId
        required: false
        schema:
          type: number
      - description: 'Short description of the client, used for informative purposes only.

          '
        in: query
        name: clientInfo
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'is returned if the request was executed successfully, and there are log

            events available for the requested range. The response body is not empty

            in this case.

            '
        '204':
          description: 'is returned if the request was executed successfully, but there are no log

            events available for the requested range. The response body is empty

            in this case.

            '
        '400':
          description: 'is returned if either the `from` or `to` values are invalid.

            '
        '405':
          description: 'is returned when an invalid HTTP method is used.

            '
        '500':
          description: 'is returned if an error occurred while assembling the response.

            '
        '501':
          description: 'is returned when this operation is called on a Coordinator in a cluster deployment.

            '
      summary: Tail recent server operations
      tags:
      - Replication
