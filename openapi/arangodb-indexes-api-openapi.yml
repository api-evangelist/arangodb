        `unique` or `sparse` flags, whereas others don''t. Some indexes also provide

        a selectivity estimate in the `selectivityEstimate` attribute of the result.

        '
      operationId: getIndex
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
