  /_admin/cluster/rebalance/execute:
    post:
      description: 'Execute the given set of move shard operations. You can use the

        `POST /_admin/cluster/rebalance` endpoint to calculate these operations to improve

        the balance of shards, leader shards, and follower shards.

        '
      operationId: executeClusterRebalancePlan
      requestBody:
        content:
          application/json:
            schema:
              properties:
                moves:
                  description: 'A set of move shard operations to execute.

                    '
                  items:
                    properties:
                      collection:
                        description: 'Collection ID of the collection the shard belongs to.

                          '
                        type: number
                      from:
                        description: 'The server name from which to move.

                          '
                        type: string
                      isLeader:
                        description: 'True if this is a leader move shard operation.

                          '
                        type: boolean
                      shard:
                        description: 'Shard ID of the shard to be moved.

                          '
                        type: string
                      to:
                        description: 'The ID of the destination server.

                          '
                        type: string
                    required:
                    - from
                    - to
                    - shard
                    - collection
                    - isLeader
                    type: object
                  type: array
                version:
                  description: 'Must be set to `1`.

                    '
                  type: number
              required:
              - version
              - moves
              type: object
      responses:
        '200':
          description: 'This API returns HTTP 200 if no operations are provided.

            '
        '202':
          description: 'This API returns HTTP 202 if the operations have been accepted and scheduled for execution.

            '
      summary: Execute a set of move shard operations
      tags:
      - Cluster
  /_admin/cluster/statistics:
    get:
      deprecated: true
      description: '> **WARNING:**

        This endpoint is deprecated and removed in ArangoDB v4.0.

        Use `GET /_admin/metrics` instead, which provides the data exposed by

        this API and a lot more.



        Queries the statistics of the given DB-Server

        '
      operationId: getClusterStatistics
      parameters:
      - description: 'The ID of a DB-Server.

          '
        in: query
        name: DBserver
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'is returned when everything went well.

            '
        '400':
          description: 'The `DBserver` parameter was not specified or is not the ID of a DB-Server.

            '
        '403':
          description: 'The specified server is not a DB-Server.

            '
      summary: Get the statistics of a DB-Server
      tags:
      - Cluster
  /_admin/cluster/uniqId:
    put:
      description: 'Reserve or skip globally unique identifiers that are used as automatically

        generated document keys when using the `traditional` or `padded` key generators.


        Either the `number` or the `minimum` query parameter needs to be specified.


        > **WARNING:**

        Only use this endpoint to resolve issues with the key generation,

        in particular of cluster deployments created with v3.12.5-2 or older.

        '
      operationId: reserveUniqueIDs
      parameters:
      - description: 'Reserve as many globally unique IDs as specified.

          '
        in: query
        name: number
        schema:
          maximum: 1000000
          minimum: 1
          type: integer
      - description: 'Make sure that globally unique IDs used in the future will always be

          at least as large as the specified value.


          Coordinators and DB-Servers will use these larger IDs only after a restart.

          '
        in: query
        name: minimum
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'The range of the reserved/skipped IDs.

                  '
                properties:
                  code:
                    description: 'The status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'Whether an error occurred. `false` in this case.

                      '
                    type: boolean
                  largest:
                    description: 'The upper bound of the IDs that have been reserved (`number`)

                      respectively skipped (`minimum`).

                      '
                    type: string
                  smallest:
                    description: 'The lower bound of the IDs that have been reserved (`number`)

                      respectively skipped (`minimum`).

                      '
                    type: string
                required:
                - code
                - error
                - smallest
                - largest
                type: object
          description: 'Successfully reserved/skipped the globally unique IDs.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'Either the `number` or the `minimum` query parameter must be provided.

            '
      summary: Reserve globally unique IDs
      tags:
      - Cluster
  /_admin/server/id:
    get:
      description: 'Returns the ID of a server in a cluster. The request will fail if the

        server is not running in cluster mode.

        '
      operationId: getServerId
      responses:
        '200':
          description: 'Is returned when the server is running in cluster mode.

            '
        '500':
          description: 'Is returned when the server is not running in cluster mode.

            '
      summary: Get the server ID
      tags:
      - Cluster
  /_admin/server/role:
    get:
      description: 'Returns the role of a server in a cluster.

        The server role is returned in the `role` attribute of the result.

        '
      operationId: getServerRole
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                  role:
                    description: "The server role.\n- `SINGLE`: the server is a standalone server without clustering\n- `COORDINATOR`: the server is a Coordinator in a cluster\n- `PRIMARY`: the server is a DB-Server in a cluster\n- `SECONDARY`: this role is not used anymore\n- `AGENT`: the server is an Agency node in a cluster\n- `UNDEFINED`: in a cluster, this is returned if the server role cannot be\n   determined.\n"
                    enum:
                    - SINGLE
                    - COORDINATOR
                    - PRIMARY
                    - SECONDARY
                    - AGENT
                    - UNDEFINED
                    type: string
                required:
                - error
                - code
                - errorNum
                - role
                type: object
          description: 'Is returned in all cases.

            '
      summary: Get the server role
      tags:
      - Cluster
  /_api/cluster/endpoints:
    get:
      description: 'Returns an object with an attribute `endpoints`, which contains an

        array of objects, which each have the attribute `endpoint`, whose value

        is a string with the endpoint description. There is an entry for each

        Coordinator in the cluster. This method only works on Coordinators in

        cluster mode. In case of an error the `error` attribute is set to

        `true`.

        '
      operationId: listClusterEndpoints
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  endpoints:
                    description: 'A list of active cluster endpoints.

                      '
                    items:
                      properties:
                        endpoint:
                          description: 'The bind of the Coordinator, like `tcp://[::1]:8530`

                            '
                          type: string
                      required:
                      - endpoint
                      type: object
                    type: array
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                required:
                - error
                - code
                - endpoints
                type: object
          description: 'is returned when everything went well.

            '
        '501':
          description: 'server is not a Coordinator or method was not GET.

            '
      summary: List all Coordinator endpoints
      tags:
      - Cluster
