                              '
                            type: integer
                          writesExecuted:
                            description: 'The total number of data-modification operations successfully executed.

                              '
                            type: integer
                          writesIgnored:
                            description: 'The total number of data-modification operations that were unsuccessful,

                              but have been ignored because of the `ignoreErrors` query option.

