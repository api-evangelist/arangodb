  /_db/{database-name}/_api/explain:
    post:
      description: "To explain how an AQL query would be executed on the server, the query string\ncan be sent to the server via an HTTP POST request. The server will then validate\nthe query and create an execution plan for it. The execution plan will be\nreturned, but the query will not be executed.\n\nThe execution plan that is returned by the server can be used to estimate the\nprobable performance of the query. Though the actual performance will depend\non many different factors, the execution plan normally can provide some rough\nestimates on the amount of work the server needs to do in order to actually run\nthe query.\n\nBy default, the explain operation will return the optimal plan as chosen by\nthe query optimizer The optimal plan is the plan with the lowest total estimated\ncost. The plan will be returned in the attribute `plan` of the response object.\nIf the option `allPlans` is specified in the request, the result will contain\nall plans created by the optimizer. The plans will then be returned in the\nattribute `plans`.\n\nThe result will also contain an attribute `warnings`, which is an array of\nwarnings that occurred during optimization or execution plan creation. Additionally,\na `stats` attribute is contained in the result with some optimizer statistics.\nIf `allPlans` is set to `false`, the result will contain an attribute `cacheable`\nthat states whether the query results can be cached on the server if the query\nresult cache were used. The `cacheable` attribute is not present when `allPlans`\nis set to `true`.\n\nEach plan in the result is a JSON object with the following attributes:\n- `nodes`: the array of execution nodes of the plan.\n\n- `estimatedCost`: the total estimated cost for the plan. If there are multiple\n  plans, the optimizer will choose the plan with the lowest total cost.\n\n- `collections`: an array of collections used in the query\n\n- `rules`: an array of rules the optimizer applied.\n\n- `variables`: array of variables used in the query (note: this may contain\n  internal variables created by the optimizer)\n"
      operationId: explainAqlQuery
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                bindVars:
                  description: 'An object with key/value pairs representing the bind parameters.

                    For a bind variable `@var` in the query, specify the value using an attribute

                    with the name `var`. For a collection bind variable `@@coll`, use `@coll` as the

                    attribute name. For example: `"bindVars": { "var": 42, "@coll": "products" }`.

                    '
                  type: object
                options:
                  description: 'Options for the query

                    '
                  properties:
                    allPlans:
                      default: false
                      description: 'If set to `true`, all possible execution plans are returned.

                        The default is `false`, meaning only the optimal plan is returned.

                        '
                      type: boolean
                    failOnWarning:
                      description: 'If set to `true`, the query throws an exception and aborts instead of producing

                        a warning. You should use this option during development to catch potential issues

                        early. When the attribute is set to `false`, warnings are not propagated to

                        exceptions and are returned with the query result.


                        Default: Controlled by the [`--query.fail-on-warning` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--queryfail-on-warning),

                        so you don''t need to set it on a per-query basis.

                        '
                      type: boolean
                    fullCount:
                      default: false
                      description: 'Whether to calculate the total number of documents matching the

                        filter conditions as if the query''s final top-level `LIMIT` operation

                        were not applied. This option generally leads to different

                        execution plans.

                        '
                      type: boolean
                    maxNodesPerCallstack:
                      description: 'The number of execution nodes in the query plan after that stack splitting is

                        performed to avoid a potential stack overflow.


                        This option is only useful for testing and debugging and normally does not need

                        any adjustment.


                        Default: Controlled by the [`--query.max-nodes-per-callstack` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querymax-nodes-per-callstack).

                        '
                      type: integer
                    maxNumberOfPlans:
                      description: 'The maximum number of plans that the optimizer is allowed to

                        generate. Setting this attribute to a low value allows you to put a

                        cap on the amount of work the optimizer does.


                        Default: Controlled by the [`--query.optimizer-max-plans` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--queryoptimizer-max-plans).

                        '
                      type: integer
                    maxWarningCount:
                      default: 10
                      description: 'Limits the number of warnings a query can return.

                        You can increased or decreased the number with this option.

                        '
                      type: integer
                    optimizer:
                      description: 'Options related to the query optimizer.

                        '
                      properties:
                        rules:
                          description: 'A list of optimizer rules, telling the optimizer to

                            include or exclude specific rules. See the

                            [List of optimizer rules](https://docs.arango.ai/arangodb/3.12/aql/execution-and-performance/query-optimization/#list-of-optimizer-rules).


                            To disable a rule, prefix its name with `-`. To enable a rule,

                            prefix it with `+`. There is also a pseudo-rule `all` that

                            matches all optimizer rules. `-all` disables all rules.

                            '
                          items:
                            type: string
                          type: array
                      type: object
                    profile:
                      default: 0
                      description: 'Whether to include additional query profiling information.

                        If set to `2`, the response includes the time it took to process

                        each optimizer rule under `stats.rules`.

                        '
                      type: integer
                    usePlanCache:
                      default: false
                      description: 'Set this option to `true` to utilize a cached query plan or add the execution plan

                        of this query to the cache if it''s not in the cache yet. Otherwise, the plan cache

                        is bypassed (introduced in v3.12.4).


                        Query plan caching can reduce the total time for processing queries by avoiding

                        to parse, plan, and optimize queries over and over again that effectively have

                        the same execution plan with at most some changes to bind parameter values.


                        An error is raised if a query doesn''t meet the requirements for plan caching.

                        See [Cache eligibility](https://docs.arango.ai/arangodb/3.12/aql/execution-and-performance/caching-query-plans/#cache-eligibility)

                        for details.

                        '
                      type: boolean
                  type: object
                query:
                  description: 'the query which you want explained; If the query references any bind variables,

                    these must also be passed in the attribute `bindVars`. Additional

                    options for the query can be passed in the `options` attribute.

                    '
                  type: string
              required:
              - query
              type: object
      responses:
        '200':
          description: 'If the query is valid, the server will respond with *HTTP 200* and

            return the optimal execution plan in the `plan` attribute of the response.

            If option `allPlans` was set in the request, an array of plans will be returned

            in the `allPlans` attribute instead.

            '
        '400':
          description: 'The request is malformed or the query contains a parse error.

            The body of the response contains the error details embedded in a JSON object.

            Omitting bind variables if the query references any also results

            an error.

            '
        '404':
          description: 'A non-existing collection is accessed in the query.

            '
      summary: Explain an AQL query
      tags:
      - Queries
  /_db/{database-name}/_api/query:
    post:
      description: 'This endpoint is for query validation only. To actually query the database,

        see `/api/cursor`.

        '
      operationId: parseAqlQuery
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                query:
                  description: 'To validate a query string without executing it, the query string can be

                    passed to the server via an HTTP POST request.

                    '
                  type: string
              required:
              - query
              type: object
      responses:
        '200':
          description: 'If the query is valid, the server will respond with *HTTP 200* and

            return the names of the bind parameters it found in the query (if any) in

            the `bindVars` attribute of the response. It will also return an array

            of the collections used in the query in the `collections` attribute.

            If a query can be parsed successfully, the `ast` attribute of the returned

            JSON will contain the abstract syntax tree representation of the query.

            The format of the `ast` is subject to change in future versions of

            ArangoDB, but it can be used to inspect how ArangoDB interprets a given

            query. Note that the abstract syntax tree will be returned without any

            optimizations applied to it.

            '
        '400':
          description: 'The request is malformed or the query contains a parse error.

            The body of the response contains the error details embedded in a JSON object.

            '
      summary: Parse an AQL query
      tags:
      - Queries
  /_db/{database-name}/_api/query-cache:
    delete:
      description: 'Clears all results stored in the AQL query results cache for the current database.

        '
      operationId: deleteAqlQueryCache
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                required:
                - error
                - code
                type: object
          description: 'The results cache has been cleared.

            '
        '400':
          description: 'The request is malformed.

            '
      summary: Clear the AQL query results cache
      tags:
      - Queries
  /_db/{database-name}/_api/query-cache/entries:
    get:
      description: 'Returns an array containing the AQL query results currently stored in the query results

        cache of the selected database.

        '
      operationId: listQueryCacheResults
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'The entries of the query results cache.

                  '
                items:
                  description: 'The properties of a cache entry.

                    '
                  properties:
                    bindVars:
                      description: 'The bind parameters. This attribute is omitted if the

                        [`--query.tracking-with-bindvars` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-bindvars) is set

                        to `false`.

                        '
                      type: object
                    dataSources:
                      description: 'The collections and Views involved in the query.

                        '
                      items:
                        type: string
                      type: array
                    hash:
                      description: 'The hash value calculated from the query string,

                        certain query options, and the bind variables.

                        '
                      type: string
                    hits:
                      description: 'How many times the result has been served from the cache so far.

                        '
                      type: integer
                    query:
                      description: 'The query string.

                        '
                      type: string
                    results:
                      description: 'The number of documents/rows in the query result.

                        '
                      type: integer
                    runTime:
                      description: 'The total duration of the query in seconds.

                        '
                      type: number
                    size:
                      description: 'The size of the query result and bind parameters (in bytes).

                        '
                      type: integer
                    started:
                      description: 'The date and time at which the query result has been added

                        to the cache (in ISO 8601 format).

                        '
                      format: date-time
                      type: string
                  required:
                  - hash
                  - query
                  - size
                  - results
                  - hits
                  - runTime
                  - started
                  - dataSources
                  type: object
                type: array
          description: 'The list of cached query results.

            '
        '400':
          description: 'The request is malformed.

            '
      summary: List the entries of the AQL query results cache
      tags:
      - Queries
  /_db/{database-name}/_api/query-cache/properties:
    get:
      description: 'Returns the global AQL query results cache configuration.

        '
      operationId: getQueryCacheProperties
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'The result cache configuration.

                  '
                properties:
                  includeSystem:
                    description: 'Whether results of queries that involve system collections

                      are stored in the query results cache.

                      '
                    type: boolean
                  maxEntrySize:
                    description: 'The maximum individual result size of queries that are

                      stored per database-specific cache (in bytes).

                      '
                  maxResults:
                    description: 'The maximum number of query results that are stored per

                      database-specific cache.

                      '
                    type: integer
                  maxResultsSize:
                    description: 'The maximum cumulated size of query results that are

                      stored per database-specific cache (in bytes).

                      '
                    type: integer
                  mode:
                    description: 'The mode the AQL query results cache operates in.

                      '
                    enum:
                    - 'off'
                    - 'on'
                    - demand
                    type: string
                type: object
          description: 'The result cache configuration is returned successfully.

            '
        '400':
          description: 'The request is malformed.

            '
      summary: Get the AQL query results cache configuration
      tags:
      - Queries
    put:
      description: 'Adjusts the global properties for the AQL query results cache.


        Changing the properties may invalidate all results currently in the cache.

        '
      operationId: setQueryCacheProperties
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: 'The result cache configuration settings to change.

                '
              properties:
                includeSystem:
                  description: 'Whether to store results of queries that involve

                    system collections in the cache.


                    Default: Controlled by the [`--query.cache-include-system-collections` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querycache-include-system-collections).

                    '
                  type: boolean
                maxEntrySize:
                  description: 'The maximum individual size of query results that are stored

                    per database-specific cache (in bytes).


                    Default: Controlled by the [`--query.cache-entry-max-size` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querycache-entry-max-size).

                    '
                  type: integer
                maxResults:
                  description: 'The maximum number of query results that are stored per

                    database-specific cache.


                    Default: Controlled by the [`--query.cache-entries` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querycache-entries).

                    '
                  type: integer
                maxResultsSize:
                  description: 'The maximum cumulated size of query results that are stored

                    per database-specific cache (in bytes).


                    Default: Controlled by the [`--query.cache-entries-max-size` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querycache-entries-max-size).

                    '
                  type: integer
                mode:
                  description: 'The mode the AQL query cache shall operate in.


                    Default: Controlled by the [`--query.cache-mode` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querycache-mode).

                    '
                  enum:
                  - 'off'
                  - 'on'
                  - demand
                  type: string
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'The result cache configuration.

                  '
                properties:
                  includeSystem:
                    description: 'Whether results of queries that involve system collections

                      are stored in the query results cache.

                      '
                    type: boolean
                  maxEntrySize:
                    description: 'The maximum individual result size of queries that are

                      stored per database-specific cache (in bytes).

                      '
                  maxResults:
                    description: 'The maximum number of query results that are stored per

                      database-specific cache.

                      '
                    type: integer
                  maxResultsSize:
                    description: 'The maximum cumulated size of query results that are

                      stored per database-specific cache (in bytes).

                      '
                    type: integer
                  mode:
                    description: 'The mode the AQL query results cache operates in.

                      '
                    enum:
                    - 'off'
                    - 'on'
                    - demand
                    type: string
                type: object
          description: 'The result cache configuration has been changed successfully.

            '
        '400':
          description: 'The request is malformed.

            '
      summary: Set the AQL query results cache configuration
      tags:
      - Queries
  /_db/{database-name}/_api/query-plan-cache:
