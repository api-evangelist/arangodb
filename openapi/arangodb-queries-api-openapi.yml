                        '
                      type: boolean
                    hash:
                      description: 'The plan cache key.

                        '
                      type: string
                    hits:
                      description: 'How many times the cached plan has been utilized so far.

                        '
                      type: integer
                    memoryUsage:
                      description: 'How much memory the plan cache entry takes up for the

