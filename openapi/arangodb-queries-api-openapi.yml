                                  enum:
                                  - read
                                  - write
                                  - exclusive
                                  type: string
                              required:
                              - name
                              - type
                              type: object
                            type: array
                          estimatedCost:
                            description: 'The estimated cost of the query.

                              '
                            type: number
                          estimatedNrItems:
                            description: 'The estimated number of results.

                              '
                            type: integer
                          isModificationQuery:
                            description: 'Whether the query contains write operations.

