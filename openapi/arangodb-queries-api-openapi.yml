        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'The entries of the query plan cache.

                  '
                items:
                  description: 'The properties of a cache entry.

                    '
                  properties:
                    bindVars:
                      description: 'A subset of the original bind parameters with only the

                        collection bind parameters (e.g. `@@coll`). They need to

                        have the same names and values for utilizing a cached plan.

                        '
                      type: object
                    created:
                      description: 'The date and time at which the query plan has been added

