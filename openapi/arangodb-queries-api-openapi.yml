                        '
                      type: integer
                    query:
                      description: 'The query string.

                        '
                      type: string
                    queryHash:
                      description: 'The hash value of the query string.

                        '
                      type: integer
                  required:
                  - hash
                  - query
                  - queryHash
                  - bindVars
                  - fullCount
                  - dataSources
                  - created
                  - hits
                  - memoryUsage
                  type: object
                type: array
          description: 'The list of cached query plans.

            '
      summary: List the entries of the AQL query plan cache
      tags:
      - Queries
  /_db/{database-name}/_api/query/current:
    get:
      description: 'Returns a list of the AQL queries that currently run in the specified

        database.


        Query tracking needs to be enabled by the

        [`--query.tracking` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking)

        or at runtime with the `enabled` query tracking property of the

        `PUT /_db/{database-name}/_api/query/properties` endpoint.

        If query tracking is disabled for the current database,

        an **empty list** is returned.

        '
      operationId: listAqlQueries
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'If set to `true`, will return the currently running queries in all databases,

          not just the selected one.

          Using the parameter is only allowed in the `_system` database and with superuser

          privileges.

          '
        in: query
        name: all
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    bindVars:
                      description: 'The bind parameter values used by the query.


                        Whether the actual bind variables or an empty object is

                        returned is controlled by the

                        [`--query.tracking-with-bindvars` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-bindvars)

                        or the `trackBindVars` query tracking property that you can

                        change via the `PUT /_db/{database-name}/_api/query/properties`

                        endpoint at runtime.

                        '
                      type: object
                    dataSources:
                      description: 'The collections and Views involved in the query.


                        Only present if the

                        [`--query.tracking-with-datasources` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-datasources)

                        is enabled.

                        '
                      items:
                        type: string
                      type: array
                    database:
                      description: 'The name of the database the query runs in.

                        '
                      type: string
                    id:
                      description: 'The query identifier.

                        '
                      type: string
                    modificationQuery:
                      description: 'Whether the query writes data (`true`) or only reads (`false`).

                        '
                      type: boolean
                    peakMemoryUsage:
                      description: 'The query''s peak memory usage in bytes (in increments of 32KB),

                        up to the point the query list was requested.

                        '
                      type: integer
                    query:
                      description: 'The query string (potentially truncated).


                        The cutoff is controlled by the

                        [`--query.max-artifact-log-length` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querymax-artifact-log-length)

                        or the `maxQueryStringLength` query tracking property

                        that you can change via the

                        `PUT /_db/{database-name}/_api/query/properties` endpoint

                        at runtime.


                        Whether the actual query string is tracked or only a

                        value of `"<hidden>"` is returned depends on the

                        [`--query.tracking-with-querystring` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-querystring).

                        '
                      type: string
                    runTime:
                      description: 'The query duration up to the point the query list was

                        requested (in seconds).

                        '
                      type: number
                    started:
                      description: 'The date and time when the query was started (in ISO 8601 format).

                        '
                      format: date-time
                      type: string
                    state:
                      description: 'The query''s current execution state.

                        '
                      enum:
                      - initializing
                      - parsing
                      - optimizing ast
                      - loading collections
                      - instantiating plan
                      - optimizing plan
                      - instantiating executors
                      - executing
                      - finalizing
                      - finished
                      - killed
                      - invalid
                      type: string
                    stream:
                      description: 'Whether the query uses a streaming cursor.

                        '
                      type: boolean
                    user:
                      description: 'The name of the user that started the query.

                        '
                      type: string
                    warnings:
                      description: 'The number of query warnings that occurred.


                        Values other than `0` may not be observable because this information

                        typically becomes available when the query finishes, at which point

                        it is no longer listed as a running query. However, non-zero values can be

                        observed when enabling `stream` and there is more than one batch of

                        results.

                        '
                      type: integer
                  required:
                  - id
                  - database
                  - user
                  - query
                  - bindVars
                  - started
                  - runTime
                  - peakMemoryUsage
                  - state
                  - stream
                  - modificationQuery
                  - warnings
                  type: object
                type: array
          description: 'The list of currently running AQL queries for the specified database.

            Empty if query tracking is disabled.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The request is malformed.

            '
        '403':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 403
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'Returned when the `all` parameter is used but the request was made

            in a database other than `_system`, or by a user without superuser

            privileges.

            '
      summary: List the running AQL queries
      tags:
      - Queries
  /_db/{database-name}/_api/query/properties:
    get:
      description: 'Returns the current query tracking properties of the specified database.

        '
      operationId: getAqlQueryTrackingProperties
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  enabled:
                    description: 'Whether query tracking is enabled for the specified

                      database. If set to `false`, neither the currently

                      running queries nor slow queries are tracked.

                      '
                    type: boolean
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  maxQueryStringLength:
                    description: 'Maximum query string length kept in the list of queries

                      (in bytes).


                      Query strings can have arbitrary lengths, and you can use

                      this property to save memory in case very long query strings

                      are used.

                      '
                    type: integer
                  maxSlowQueries:
                    description: 'The maximum number of slow queries kept in the list.

                      If the list of slow queries is full, the oldest entry

                      is discarded when additional slow queries occur.

                      '
                    type: integer
                  slowQueryThreshold:
                    description: 'Threshold in seconds for treating a regular query as slow

                      (the `stream` option is `false` for the query).

                      '
                    type: number
                  slowStreamingQueryThreshold:
                    description: 'Threshold in seconds for treating a streaming query as slow

                      (the `stream` option is `true` for the query).

                      '
                    type: number
                  trackBindVars:
                    description: 'Whether bind variables used in queries are tracked.

                      '
                    type: boolean
                  trackSlowQueries:
                    description: 'Whether slow queries are tracked. The `enabled` property

                      must be set to `true` as well in order to track slow queries.


                      Queries are added to the list of slow queries after

                      finishing and if their runtime exceeded the value set in

                      `slowQueryThreshold`.

                      '
                    type: boolean
                required:
                - error
                - code
                - enabled
                - trackSlowQueries
                - trackBindVars
                - maxSlowQueries
                - slowQueryThreshold
                - slowStreamingQueryThreshold
                - maxQueryStringLength
                type: object
          description: 'The query tracking properties were retrieved successfully.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The request is malformed.

            '
      summary: Get the AQL query tracking configuration
      tags:
      - Queries
    put:
      description: 'Modify one or more query tracking properties at runtime for the

        specified database.

        '
      operationId: updateAqlQueryTrackingProperties
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                enabled:
                  description: 'Whether to track queries for the specified database.

                    If set to `false`, neither the currently

                    running queries nor slow queries are tracked.


                    Default: Controlled by the [`--query.tracking` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking).

                    '
                  type: boolean
                maxQueryStringLength:
                  default: 4096
                  description: 'The maximum query string length to keep in the list of queries.


                    Query strings can have arbitrary lengths, and you can use

                    this property to save memory in case very long query strings

                    are used.


                    You can disable the tracking of query strings by default

                    with the [`--query.tracking-with-querystring` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-querystring).

                    '
                  type: integer
                maxSlowQueries:
                  default: 64
                  description: 'The maximum number of slow queries to keep in the list

                    of slow queries. If the list of slow queries is full, the oldest entry

                    is discarded when additional slow queries occur.

                    '
                  type: integer
                slowQueryThreshold:
                  description: 'Threshold in seconds for treating a regular query as slow

                    (the `stream` option is `false` for the query).


                    Default: Controlled by the [`--query.slow-threshold` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--queryslow-threshold).

                    '
                  type: number
                slowStreamingQueryThreshold:
                  description: 'Threshold in seconds for treating a streaming query as slow

                    (the `stream` option is `true` for the query).


                    Default: Controlled by the [`--query.slow-streaming-threshold` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--queryslow-streaming-threshold).

                    '
                  type: number
                trackBindVars:
                  description: 'Whether to track bind variables used in queries.


                    Default: Controlled by the [`--query.tracking-with-bindvars` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-bindvars).

                    '
                  type: boolean
                trackSlowQueries:
                  description: 'Whether to track slow queries. The `enabled` property

                    must be set to `true` as well in order to track slow queries.


                    Queries are added to the list of slow queries after

                    finishing and if their runtime exceeded the value set in

                    `slowQueryThreshold`.


                    Default: Controlled by the [`--query.tracking-slow-queries` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-slow-queries).

                    '
                  type: boolean
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  enabled:
                    description: 'Whether query tracking is enabled for the specified

                      database. If set to `false`, neither the currently

                      running queries nor slow queries are tracked.

                      '
                    type: boolean
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  maxQueryStringLength:
                    description: 'Maximum query string length kept in the list of queries

                      (in bytes).


                      Query strings can have arbitrary lengths, and you can use

                      this property to save memory in case very long query strings

                      are used.

                      '
                    type: integer
                  maxSlowQueries:
                    description: 'The maximum number of slow queries kept in the list.

                      If the list of slow queries is full, the oldest entry

                      is discarded when additional slow queries occur.

                      '
                    type: integer
                  slowQueryThreshold:
                    description: 'Threshold in seconds for treating a regular query as slow

                      (the `stream` option is `false` for the query).

                      '
                    type: number
                  slowStreamingQueryThreshold:
                    description: 'Threshold in seconds for treating a streaming query as slow

                      (the `stream` option is `true` for the query).

                      '
                    type: number
                  trackBindVars:
                    description: 'Whether bind variables used in queries are tracked.

                      '
                    type: boolean
                  trackSlowQueries:
                    description: 'Whether slow queries are tracked. The `enabled` property

                      must be set to `true` as well in order to track slow queries.


                      Queries are added to the list of slow queries after

                      finishing and if their runtime exceeded the value set in

                      `slowQueryThreshold`.

                      '
                    type: boolean
                required:
                - error
                - code
                - enabled
                - trackSlowQueries
                - trackBindVars
                - maxSlowQueries
                - slowQueryThreshold
                - slowStreamingQueryThreshold
                - maxQueryStringLength
                type: object
          description: 'The properties were changed successfully. The response body contains

            the current set of query tracking properties.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The request is malformed.

            '
      summary: Update the AQL query tracking configuration
      tags:
      - Queries
  /_db/{database-name}/_api/query/rules:
    get:
      description: 'A list of all optimizer rules and their properties.

        '
      operationId: getAqlQueryOptimizerRules
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'An array of objects. Each object describes an AQL optimizer rule.

                  '
                items:
                  properties:
                    flags:
                      description: 'An object with the properties of the rule.

                        '
                      properties:
                        canBeDisabled:
                          description: 'Whether users are allowed to disable this rule. A few rules are mandatory.

                            '
                          type: boolean
                        canCreateAdditionalPlans:
                          description: 'Whether this rule may create additional query execution plans.

                            '
                          type: boolean
                        clusterOnly:
                          description: 'Whether the rule is applicable in the cluster deployment mode only.

                            '
                          type: boolean
                        disabledByDefault:
                          description: 'Whether the optimizer considers this rule by default.

                            '
                          type: boolean
                        enterpriseOnly:
                          description: 'Whether the rule is implemented in the non-public enterprise code.

                            '
                          type: boolean
                        hidden:
                          description: 'Whether the rule is displayed to users. Internal rules are hidden.

                            '
                          type: boolean
                      required:
                      - hidden
                      - clusterOnly
                      - canBeDisabled
                      - canCreateAdditionalPlans
                      - disabledByDefault
                      - enterpriseOnly
                      type: object
                    name:
                      description: 'The name of the optimizer rule as seen in query explain outputs.

                        '
                      type: string
                  required:
                  - name
                  - flags
                  type: object
                type: array
          description: 'is returned if the list of optimizer rules can be retrieved successfully.

            '
      summary: List all AQL optimizer rules
      tags:
      - Queries
  /_db/{database-name}/_api/query/slow:
    delete:
      description: 'Clears the list of slow AQL queries for the current database.

        '
      operationId: clearSlowAqlQueryList
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'If set to `true`, clears the slow query history in all databases, not just

          the specified one.

          Using the parameter is only allowed in the `_system` database and with superuser

          privileges.

          '
        in: query
        name: all
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                required:
                - error
                - code
                type: object
          description: 'The list of slow queries was cleared successfully.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The request is malformed.

            '
      summary: Clear the list of slow AQL queries
      tags:
      - Queries
    get:
      description: 'Returns a list of the recently finished AQL queries that exceeded the

        slow query threshold in the specified database.


        Slow query tracking needs to be enabled by the

        [`--query.tracking-slow-queries` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-slow-queries)

        or at runtime with the `trackSlowQueries` query tracking property of the

        `PUT /_db/{database-name}/_api/query/properties` endpoint.

        If slow query tracking is disabled for the current database,

        an **empty list** is returned.


        The maximum amount of queries in the list can be controlled by setting

        the `maxSlowQueries` query tracking property via the

        `PUT /_db/{database-name}/_api/query/properties` endpoint at runtime.


        The threshold for treating a query as *slow* can be adjusted separate

        for queries with the `stream` option on or off by setting the

        [`--query.slow-threshold`](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--queryslow-threshold)

        and [`--query.slow-streaming-threshold`](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--queryslow-streaming-threshold)

        startup options or at runtime with the `slowQueryThreshold` and

        `slowStreamingQueryThreshold` query tracking properties of the

        `PUT /_db/{database-name}/_api/query/properties` endpoint.

        '
      operationId: listSlowAqlQueries
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'If set to `true`, returns the slow queries from all databases, not just

          the specified one.

          Using the parameter is only allowed in the `_system` database and with superuser

          privileges.

          '
        in: query
        name: all
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    bindVars:
                      description: 'The bind parameter values used by the query.


                        Whether the actual bind variables or an empty object is

                        returned is controlled by the

                        [`--query.tracking-with-bindvars` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-bindvars)

                        or the `trackBindVars` query tracking property that you can

                        change via the `PUT /_db/{database-name}/_api/query/properties`

                        endpoint at runtime.

                        '
                      type: object
                    dataSources:
                      description: 'The collections and Views involved in the query.


                        Only present if the

                        [`--query.tracking-with-datasources` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-datasources)

                        is enabled.

                        '
                      items:
                        type: string
                      type: array
                    database:
                      description: 'The name of the database the query ran in.

                        '
                      type: string
                    exitCode:
                      description: 'An error code (`errorNum`) that indicates why the query

                        failed, or `0` on success. See the

                        [error codes](https://docs.arango.ai/arangodb/3.12/develop/error-codes/) documentation.

                        '
                      type: integer
                    id:
                      description: 'The internal identifier of the query.

                        '
                      type: string
                    modificationQuery:
                      description: 'Whether the query created, updated, replaced, or deleted

                        any documents (`true`) or only read data (`false`).

                        '
                      type: boolean
                    peakMemoryUsage:
                      description: 'The query''s peak memory usage in bytes (in increments of 32KB).

                        '
                      type: integer
                    query:
                      description: 'The query string (potentially truncated).


                        The cutoff is controlled by the

                        [`--query.max-artifact-log-length` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querymax-artifact-log-length)

                        or the `maxQueryStringLength` query tracking property

                        that you can change via the

                        `PUT /_db/{database-name}/_api/query/properties` endpoint

                        at runtime.


                        Whether the actual query string is tracked or only a

                        value of `"<hidden>"` is returned depends on the

                        [`--query.tracking-with-querystring` startup option](https://docs.arango.ai/arangodb/3.12/components/arangodb-server/options/#--querytracking-with-querystring).

                        '
                      type: string
                    runTime:
                      description: 'The total query duration (in seconds).

                        '
                      type: number
                    started:
                      description: 'The date and time when the query was started (ISO 8601).

                        '
                      format: date-time
                      type: string
                    state:
                      description: 'The query''s last execution state.

                        '
                      enum:
                      - finished
                      - killed
                      - invalid
                      type: string
                    stream:
                      description: 'Whether the query used a streaming cursor (`stream` query option).

                        '
                      type: boolean
                    user:
                      description: 'The name of the user who started the query.

                        '
                      type: string
                    warnings:
                      description: 'The number of query warnings that occurred.

                        '
                      type: integer
                  required:
                  - id
                  - database
                  - user
                  - query
                  - bindVars
                  - started
                  - runTime
                  - peakMemoryUsage
                  - state
                  - stream
                  - modificationQuery
                  - warnings
                  - exitCode
                  type: object
                type: array
          description: 'The list of recently finished AQL queries that exceeded the slow

            query threshold. Empty if query tracking or slow query tracking is

            disabled.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The request is malformed.

            '
        '403':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 403
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'Returned when the `all` parameter is used but the request was made

            in a database other than `_system`, or by a user without superuser

            privileges.

            '
      summary: List the slow AQL queries
      tags:
      - Queries
  /_db/{database-name}/_api/query/{query-id}:
    delete:
      description: 'Kills a running query in the currently selected database. The query will be

        terminated at the next cancellation point.

        '
      operationId: deleteAqlQuery
      parameters:
      - description: 'The name of the database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'The identifier of the query.

          '
        in: path
        name: query-id
        required: true
        schema:
          type: string
      - description: 'If set to `true`, attempt to kill the specified query in all databases,

          not just the selected one.

          Using the parameter is only allowed in the `_system` database and with superuser

          privileges.

          '
        in: query
        name: all
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: 'The query was still running when the kill request was executed and

            the query''s kill flag has been set.

            '
        '400':
          description: 'The request is malformed.

            '
        '403':
          description: 'In case the `all` parameter is used but the request was made in a

            different database than `_system`, or by a non-privileged user.

            '
        '404':
          description: 'A query with the specified identifier cannot be found.

            '
      summary: Kill a running AQL query
      tags:
      - Queries
