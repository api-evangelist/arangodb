                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  extra:
                    description: 'An optional JSON object with extra information about the query result.


                      Only delivered as part of the first batch, or the last batch in case of a cursor

                      with the `stream` option enabled.

