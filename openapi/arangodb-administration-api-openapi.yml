  /_db/{database-name}/_admin/shutdown:
    delete:
      description: 'This call initiates a clean shutdown sequence. Requires administrative privileges.

        '
      operationId: startShutdown
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database and administrate access to the `_system` database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: "<small>Introduced in: v3.7.12, v3.8.1, v3.9.0</small>\n\nIf set to `true`, this initiates a soft shutdown. This is only available\non Coordinators. When issued, the Coordinator tracks a number of ongoing\noperations, waits until all have finished, and then shuts itself down\nnormally. It will still accept new operations.\n\nThis feature can be used to make restart operations of Coordinators less\nintrusive for clients. It is designed for setups with a load balancer in front\nof Coordinators. Remove the designated Coordinator from the load balancer before\nissuing the soft-shutdown. The remaining Coordinators will internally forward\nrequests that need to be handled by the designated Coordinator. All other\nrequests will be handled by the remaining Coordinators, reducing the designated\nCoordinator's load.\n\nThe following types of operations are tracked:\n\n - AQL cursors (in particular streaming cursors)\n - Transactions (in particular stream transactions)\n - Ongoing asynchronous requests (using the `x-arango-async: store` HTTP header)\n - Finished asynchronous requests, whose result has not yet been\n   collected\n - Queued low priority requests (most normal requests)\n - Ongoing low priority requests\n"
        in: query
        name: soft
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: 'is returned in all cases, `OK` will be returned in the result buffer on success.

            '
      summary: Start the shutdown sequence
      tags:
      - Administration
    get:
      description: "<small>Introduced in: v3.7.12, v3.8.1, v3.9.0</small>\n\nThis call reports progress about a soft Coordinator shutdown (see\ndocumentation of `DELETE /_admin/shutdown?soft=true`).\nIn this case, the following types of operations are tracked:\n\n - AQL cursors (in particular streaming cursors)\n - Transactions (in particular stream transactions)\n - Ongoing asynchronous requests (using the `x-arango-async: store` HTTP header)\n - Finished asynchronous requests, whose result has not yet been\n   collected\n - Queued low priority requests (most normal requests)\n - Ongoing low priority requests\n\nThis API is only available on Coordinators.\n"
      operationId: getShutdownProgress
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database and administrate access to the `_system` database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  AQLcursors:
                    description: 'Number of AQL cursors that are still active.

                      '
                    type: number
                  allClear:
                    description: 'Whether all active operations finished.

                      '
                    type: boolean
                  doneJobs:
                    description: 'Number of finished asynchronous requests, whose result has not yet been collected.

                      '
                    type: number
                  lowPrioOngoingRequests:
                    description: 'Number of queued low priority requests.

                      '
                    type: number
                  lowPrioQueuedRequests:
                    description: 'Number of ongoing low priority requests.

                      '
                    type: number
                  pendingJobs:
                    description: 'Number of ongoing asynchronous requests.

                      '
                    type: number
                  softShutdownOngoing:
                    description: 'Whether a soft shutdown of the Coordinator is in progress.

                      '
                    type: boolean
                  transactions:
                    description: 'Number of ongoing transactions.

                      '
                    type: number
                required:
                - softShutdownOngoing
                - AQLcursors
                - transactions
                - pendingJobs
                - doneJobs
                - lowPrioOngoingRequests
                - lowPrioQueuedRequests
                - allClear
                type: object
          description: 'The response indicates the fact that a soft shutdown is ongoing and the

            number of active operations of the various types. Once all numbers have gone

            to 0, the flag `allClear` is set and the Coordinator shuts down automatically.

            '
      summary: Query the soft shutdown progress
      tags:
      - Administration
  /_db/{database-name}/_admin/status:
    get:
      description: 'Returns status information about the server.

        '
      operationId: getStatus
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database. If the `--server.harden` startup option is enabled,

          administrate access to the `_system` database is required.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  agency:
                    description: 'Information about the Agency.

                      *Cluster only* (Coordinators and DB-Servers).

                      '
                    properties:
                      agencyComm:
                        description: 'Information about the communication with the Agency.

                          *Cluster only* (Coordinators and DB-Servers).

                          '
                        properties:
                          endpoints:
                            description: 'A list of possible Agency endpoints.

                              '
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                  agent:
                    description: 'Information about the Agents.

                      *Cluster only* (Agents)

                      '
                    properties:
                      endpoint:
                        description: 'The endpoint of the queried Agent.

                          '
                        type: string
                      id:
                        description: 'Server ID of the queried Agent.

                          '
                        type: string
                      leaderId:
                        description: 'Server ID of the leading Agent.

                          '
                        type: string
                      leading:
                        description: 'Whether the queried Agent is the leader.

                          '
                        type: boolean
                      term:
                        description: 'The current term number.

                          '
                        type: number
                    type: object
                  coordinator:
                    description: 'Information about the Coordinators.

                      *Cluster only* (Coordinators)

                      '
                    properties:
                      foxxmaster:
                        description: 'The server ID of the Coordinator that is the Foxx master.

                          **Deprecated**

                          '
                        items:
                          type: string
                        type: array
                      isFoxxmaster:
                        description: 'Whether the queried Coordinator is the Foxx master.

                          **Deprecated**

                          '
                        items:
                          type: string
                        type: array
                    type: object
                  foxxApi:
                    description: 'Whether the Foxx API is enabled. **Deprecated**

                      '
                    type: boolean
                  host:
                    description: 'A host identifier defined by the `HOST` or `NODE_NAME` environment variable,

                      or a fallback value using a machine identifier or the cluster/Agency address.

                      '
                    type: string
                  hostname:
                    description: 'A hostname defined by the `HOSTNAME` environment variable.

                      '
                    type: string
                  license:
                    description: 'ArangoDB Edition, either `"community"` or `"enterprise"`.

                      '
                    type: string
                  mode:
                    description: 'Either `"server"` or `"console"`. **Deprecated**

                      '
                    type: string
                  operationMode:
                    description: 'Either `"server"` or `"console"`. **Deprecated**

                      '
                    type: string
                  pid:
                    description: 'The process ID of _arangod_.

                      '
                    type: number
                  server:
                    description: 'Always `"arango"`.

                      '
                    type: string
                  serverInfo:
                    description: 'Information about the server status.

                      '
                    properties:
                      address:
                        description: 'The address of the server, e.g. `tcp://[::1]:8530`.

                          *Cluster only* (Coordinators and DB-Servers).

                          '
                        type: string
                      maintenance:
                        description: 'Whether the maintenance mode is enabled.

                          '
                        type: boolean
                      persistedId:
                        description: 'The persisted ID, e. g. `"CRDN-e427b441-5087-4a9a-9983-2fb1682f3e2a"`.

                          *Cluster only* (Agents, Coordinators, and DB-Servers).

                          '
                        type: string
                      progress:
                        description: 'Startup and recovery information.


                          You can check for changes to determine whether progress was made between two

                          calls, but you should not rely on specific values as they may change between

                          ArangoDB versions. The values are only expected to change during the startup and

                          shutdown, i.e. while `maintenance` is `true`.


                          You need to start _arangod_ with the `--server.early-connections` startup option

                          enabled to be able to query the endpoint during the startup process.

                          If authentication is enabled, then you need to use the super-user JWT for the

                          request because the user management is not available during the startup.

                          '
                        properties:
                          feature:
                            description: 'Internal name of the feature that is currently being prepared, started,

                              stopped or unprepared.

                              '
                            type: string
                          phase:
                            description: 'Name of the lifecycle phase the instance is currently in. Normally one of

                              `"in prepare"`, `"in start"`, `"in wait"`, `"in shutdown"`, `"in stop"`,

                              or `"in unprepare"`.

                              '
                            type: string
                          recoveryTick:
                            description: 'Current recovery sequence number value, if the instance is currently recovering.

                              If the instance is already past the recovery, this attribute will contain the

                              last handled recovery sequence number.

                              '
                            type: number
                        required:
                        - phase
                        - feature
                        - recoveryTick
                        type: object
                      readOnly:
                        description: 'Whether writes are disabled.

                          '
                        type: boolean
                      rebootId:
                        description: 'The reboot ID. Changes on every restart.

                          *Cluster only* (Agents, Coordinators, and DB-Servers).

                          '
                        type: number
                      role:
                        description: 'Either `"SINGLE"`, `"COORDINATOR"`, `"PRIMARY"` (DB-Server), or `"AGENT"`.

                          '
                        type: string
                      serverId:
                        description: 'The server ID, e.g. `"CRDN-e427b441-5087-4a9a-9983-2fb1682f3e2a"`.

                          *Cluster only* (Coordinators and DB-Servers).

                          '
                        type: string
                      state:
                        description: 'Either `"STARTUP"`, `"SERVING"`, or `"SHUTDOWN"`.

                          *Cluster only* (Coordinators and DB-Servers).

                          '
                        type: string
                      writeOpsEnabled:
                        description: 'Whether writes are enabled. **Deprecated**, use `readOnly` instead.

                          '
                        type: boolean
                    required:
                    - progress
                    - role
                    - writeOpsEnabled
                    - readOnly
                    - maintenance
                    type: object
                  version:
                    description: 'The server version as a string.

                      '
                    type: string
                required:
                - server
                - license
                - version
                - mode
                - operationMode
                - foxxApi
                - host
                - pid
                - serverInfo
                type: object
          description: 'Status information was returned successfully.

            '
      summary: Get server status information
      tags:
      - Administration
  /_db/{database-name}/_admin/time:
    get:
      description: 'The call returns an object with the `time` attribute. This contains the

        current system time as a Unix timestamp with microsecond precision.

        '
      operationId: getTime
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 200
                    type: integer
                  error:
                    description: 'A flag indicating that no error occurred.

                      '
                    example: false
                    type: boolean
                  time:
                    description: 'The current system time as a Unix timestamp with microsecond precision of the server

                      '
                    type: number
                required:
                - error
                - code
                - time
                type: object
          description: 'Time was returned successfully.

            '
      summary: Get the system time
      tags:
      - Administration
  /_db/{database-name}/_api/engine:
    get:
      description: 'Returns the storage engine the server is configured to use.

        '
      operationId: getEngine
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  name:
                    description: 'Always `rocksdb`.

                      '
                    type: string
                required:
                - name
                type: object
          description: 'Successfully retrieved storage engine name.

            '
        '401':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 401
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'Missing read access to the given database.

            '
      summary: Get the storage engine type
      tags:
      - Administration
  /_db/{database-name}/_api/engine/stats:
    get:
      description: 'Returns detailed statistics related to the RocksDB storage engine activity,

        including figures about data size, cache usage, individual column families, etc.

        '
      operationId: getEngineStats
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database. If the `--server.harden` startup option is enabled,

          administrate access to the `_system` database is required.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'A plethora of information about RocksDB.

                  '
                type: object
          description: 'Successfully retrieved the storage engine statistics.

            '
        '401':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 401
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The user account you authenticated with lacks read access to the

            specified database, the credentials are wrong, or the user account

            is inactive.

            '
        '403':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 403
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'The `--server.harden` startup option is enabled but the user account

            you authenticated with lacks write access to the `_system` database.

            '
      summary: Get the storage engine statistics
      tags:
      - Administration
