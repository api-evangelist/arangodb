  /_db/{database-name}/_admin/license:
    get:
      description: 'View the license information and status of the ArangoDB deployment.


        Can be called on single servers, Coordinators, and DB-Servers.


        In the Community Edition before v3.12.5, only `{"license":"none"}`

        is returned.

        '
      operationId: getLicense
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database. If the `--server.harden` startup option is enabled,

          administrate access to the `_system` database is required.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  diskUsage:
                    description: 'Information about the dataset size limit if you use the

                      Community Edition.


                      This attribute is not present if an Enterprise Edition

                      license is applied.

                      '
                    properties:
                      bytesLimit:
                        description: 'The maximum dataset size for your Community Edition deployment.

                          '
                        type: integer
                      bytesUsed:
                        description: 'The determined dataset size of your deployment.

                          '
                        type: integer
                      limitReached:
                        description: 'Whether the dataset size exceeds the limit.

                          '
                        type: boolean
                      secondsUntilReadOnly:
                        description: 'The time until read-only mode is entered if you are over the limit.

                          '
                        type: integer
                      secondsUntilShutDown:
                        description: 'The time until shutdown if you are over the limit.

                          '
                        type: integer
                      status:
                        description: "The state of your Community Edition deployment with regard to\nthe dataset size limit at a glance.\n\n- `good`: The dataset size of your deployment is below the 100 GiB limit.\n- `limit-reached`: Your deployment exceeds the size limit and you have two days\n  to bring the deployment back below 100 GiB. Consider acquiring an\n  Enterprise Edition license to lift the limit.\n- `read-only`: Your deployment is in read-only mode because it exceeded the\n  size limit for two days. All read operations to the instance keep functioning\n  for two more days. However, no data or data definition changes can be made.\n- `shutdown`: The server shuts down after two days of read-only mode.\n"
                        enum:
                        - good
                        - limit-reached
                        - read-only
                        - shutdown
                        type: string
                    required:
                    - bytesUsed
                    - bytesLimit
                    - limitReached
                    - secondsUntilReadOnly
                    - secondsUntilShutDown
                    - status
                    type: object
                  features:
                    description: 'The properties of the license.


                      This attribute is only present if an Enterprise Edition license is applied.

                      '
                    properties:
                      expires:
                        description: 'The `expires` key lists the expiry date as Unix timestamp (seconds since

                          January 1st, 1970 UTC).

                          '
                        example: 1683173040
                        type: number
                    required:
                    - expires
                    type: object
                  hash:
                    description: 'The hash value of the license.


                      This attribute is only present if an Enterprise Edition license is applied.

                      '
                    example: 982db5...44f3
                    type: string
                  license:
                    description: 'The encrypted license key in Base64 encoding.


                      This attribute is only present if an Enterprise Edition license is applied

                      (or has a value of `"none"` in the Community Edition before v3.12.5).

                      '
                    example: V0h/W...wEDw==
                    type: string
                  status:
                    description: "The `status` attribute allows you to confirm the state of the\napplied license at a glance.\n\n- `good`: The license is still valid for more than a week.\n- `expiring`: The license is valid for less than a week.\n  This status is not applicable if you use license activation\n  (managed license, from v3.12.6 onward) rather than a license key,\n  in which case the transition is directly from `good` to\n  `read-only` when the activation expires.\n- `read-only`: The license has expired. The instance is now\n  restricted to read-only mode.\n\nThis attribute is only present if an Enterprise Edition license is applied.\n"
                    enum:
                    - good
                    - expiring
                    - read-only
                    example: good
                    type: string
                  upgrading:
                    description: 'Whether the server is performing a database upgrade.

                      '
                    example: false
                    type: boolean
                  version:
                    description: 'The license version number.


                      This attribute is only present if an Enterprise Edition license is applied.

                      '
                    example: 1
                    type: number
                type: object
          description: 'Returns the license information.

            '
      summary: Get information about the current license
      tags:
      - Administration
    put:
      description: 'Set a new license for an Enterprise Edition instance.

        Can be called on single servers, Coordinators, and DB-Servers.

        '
      operationId: setLicense
      parameters:
      - description: 'The name of a database. Which database you use doesn''t matter as long

          as the user account you authenticate with has at least read access

          to this database. If the `--server.harden` startup option is enabled,

          administrate access to the `_system` database is required.

          '
        example: _system
        in: path
        name: database-name
        required: true
        schema:
          type: string
      - description: 'Whether to change the license even if it expires sooner than the current one.

          '
        in: query
        name: force
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              description: 'The request body has to contain the Base64-encoded license string wrapped in double quotes.

                '
              example: eyJncmFudCI6...(Base64-encoded license string)...
              type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      code:
                        description: 'The HTTP response status code.

                          '
                        example: 201
                        type: integer
                      error:
                        description: 'A flag indicating that no error occurred.

                          '
                        example: false
                        type: boolean
                    required:
                    - error
                    - code
                    type: object
                required:
                - result
                type: object
          description: 'License successfully deployed.

            '
        '400':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 400
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'If the license expires earlier than the previously installed one,

            or if the supplied license string is invalid.

            '
        '501':
          content:
            application/json:
              schema:
                properties:
                  code:
                    description: 'The HTTP response status code.

                      '
                    example: 501
                    type: integer
                  error:
                    description: 'A flag indicating that an error occurred.

                      '
                    example: true
                    type: boolean
                  errorMessage:
                    description: 'A descriptive error message.

                      '
                    type: string
                  errorNum:
                    description: 'The ArangoDB error number for the error that occurred.

                      '
                    type: integer
                required:
                - error
                - code
                - errorNum
                - errorMessage
                type: object
          description: 'If you try to apply a license using a custom build of the public source code.

            '
      summary: Set a new license
      tags:
      - Administration
