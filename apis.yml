apis:
- aid: arangodb:amp-api
  name: Arango Managed Platform (AMP) API
  description: >-
    The control-plane API of the Arango Managed Platform (formerly ArangoGraph Insights Platform / Oasis)
    — the managed ArangoDB cloud. It is a gRPC API defined in protocol buffers, covering organizations,
    projects, deployments, IAM and API keys, backups and backup policies, billing, credits and usage,
    audit logs, IP allowlists, CA certificates, private endpoints, metrics, monitoring, notebooks, ML
    services, replication, SCIM provisioning and support plans.
  humanURL: https://docs.arango.ai/amp/api/
  baseURL: https://api.cloud.arangodb.com
  tags:
  - Cloud Infrastructure
  - Managed Database
  - gRPC
  - IAM
  - Billing
  properties:
  - type: Protobuf
    url: grpc/
  - type: Documentation
    url: https://docs.arango.ai/amp/api/
  - type: GettingStarted
    url: https://docs.arango.ai/amp/api/set-up-a-connection/
- aid: arangodb:amp-scim-api
  name: Arango Managed Platform SCIM API
  description: >-
    SCIM 2.0 user and group provisioning endpoint for Arango Managed Platform organizations, used to synchronize
    identities from an external identity provider into an AMP organization. Authenticated with an AMP
    API key ID and secret over HTTP Basic.
  humanURL: https://docs.arango.ai/amp/security-and-access-control/single-sign-on/scim-provisioning/
  baseURL: https://dashboard.arangodb.cloud/api/scim/v1
