apis:
- aid: arangodb:arangodb-core-api
  name: ArangoDB Core API
  description: 'The RESTful HTTP API of the ArangoDB Core database system, version
    3.12.10 (API v0). 174 paths and 254 operations across 22 tags covering documents,
    collections, databases, named
    graphs, indexes, AQL queries and cursors, views and analyzers, transactions, Foxx
    microservices, users, replication, hot backups, cluster administration and monitoring.
    Published by ArangoDB as an OpenAPI 3.1.0 document inside the arangodb/arangodb
    source tree and rendered as the HTTP API reference in the documentation.'
  humanURL: https://docs.arango.ai/arangodb/stable/develop/http-api/
  baseURL: https://{deployment-id}.arangodb.cloud:8529
  x-baseurl-note: ArangoDB is deployed per instance. On the Arango Managed Platform
    each deployment gets its own endpoint on *.arangodb.cloud (port 8529); self-managed
    installations expose the same API on their own host.
  tags:
  - Database
  - Graph Database
  - Documents
  - AQL
  - REST
  properties:
  - type: OpenAPI
    url: openapi/arangodb-core-openapi-original.json
  - type: Documentation
    url: https://docs.arango.ai/arangodb/stable/develop/http-api/
  - type: Overlay
    url: overlays/arangodb-core-overlay.yaml
- aid: arangodb:amp-api
  name: Arango Managed Platform (AMP) API
  description: 'The control-plane API of the Arango Managed Platform (formerly ArangoGraph
    Insights Platform / Oasis) — the managed ArangoDB cloud. It is a gRPC API defined
    in protocol buffers, covering organizations, projects, deployments, IAM and API
    keys, backups and backup policies, billing, credits and usage, audit logs, IP allowlists,
    CA certificates, private endpoints, metrics, monitoring, notebooks, ML services,
    replication, SCIM provisioning and support plans.'
  humanURL: https://docs.arango.ai/amp/api/
  baseURL: https://api.cloud.arangodb.com
  tags:
  - Cloud Infrastructure
  - Managed Database
  - gRPC
  - IAM
  - Billing
  properties:
  - type: Protobuf
    url: grpc/
  - type: Documentation
    url: https://docs.arango.ai/amp/api/
  - type: GettingStarted
    url: https://docs.arango.ai/amp/api/set-up-a-connection/
- aid: arangodb:amp-scim-api
  name: Arango Managed Platform SCIM API
  description: 'SCIM 2.0 user and group provisioning endpoint for Arango Managed Platform
    organizations, used to synchronize identities from an external identity provider
    into an AMP organization. Authenticated with an AMP API key ID and secret over HTTP
    Basic.'
  humanURL: https://docs.arango.ai/amp/security-and-access-control/single-sign-on/scim-provisioning/
  baseURL: https://dashboard.arangodb.cloud/api/scim/v1
