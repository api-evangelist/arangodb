aid: arangodb
name: ArangoDB
description: 'ArangoDB (now operating as Arango) is the company behind the open-source,
  graph-native multi-model database of the same name, which unifies graph, document,
  key/value, vector and full-text search in a single core with one declarative query
  language, AQL. The database exposes its entire feature surface over a RESTful HTTP
  API documented with OpenAPI 3.1, and the company also runs the Arango Managed Platform
  (AMP, formerly ArangoGraph Insights Platform / Oasis) — a managed cloud on AWS, GCP
  and Azure whose control plane is a gRPC/Protobuf API at api.cloud.arangodb.com with
  a companion oasisctl CLI. Arango publishes official drivers for JavaScript, Python,
  Java, Go and PHP, an official Model Context Protocol server for AQL generation, and
  a Kubernetes operator.'
