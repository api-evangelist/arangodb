description: >-
  The entity graph of the ArangoDB Core API. The spec declares no
  `components.schemas`, so relationships are derived from the path hierarchy and
  the identifier parameters each operation takes rather than from $ref links.
  ArangoDB's own data model is itself a graph: documents live in collections,
  collections live in databases, edge collections connect document collections,
  and named graphs are declared sets of edge definitions over them.
identifier_conventions:
  document_key: _key — unique within a collection, client- or server-assigned
  document_id: _id — "<collection>/<key>", unique within a database
  document_revision: _rev — changes on every write; the ETag / If-Match value
  edge_endpoints: [_from, _to]
  note: >-
    `_id` is the universal cross-collection reference: an edge's `_from`/`_to`
    are `_id` values, and AQL traversals start from an `_id`.
