source: >-
  mcp/arangodb-mcp.yml (tool list transcribed from
  https://docs.arango.ai/ecosystem/arangodb-mcp-server/) bound against
  openapi/arangodb-core-openapi-original.json (ArangoDB Core API 3.12.10, OpenAPI 3.1.0)
description: >-
  Binds every tool exposed by the official ArangoDB MCP server to the OpenAPI
  operation(s) that back it, so each tool inherits a real input contract from the
  spec rather than a guessed one. Confidence is set honestly: the MCP server is
  distributed as a Docker image the agent runtime launches locally, so there is no
  anonymous tools/list to introspect and the bindings are made by name and
  documented semantics.
surfaces:
  openapi:
    file: openapi/arangodb-core-openapi-original.json
    title: ArangoDB Core API
    version: 3.12.10 (API v0)
    operations: 254
    gated: false
  mcp:
    server: arangodb/mcp-arangodb
    transport: stdio (local Docker image)
    tools_list_gated: true
    reason: >-
      No vendor-hosted remote endpoint; tools/list requires launching the image
      against a live deployment with credentials.
  graphql:
    present: false
crosswalk:
- tool: fetch-schemas
  category: discovery
  rest:
  - listCollections
  binding: rest
  confidence: high
  note: >-
    GET /_api/collection. The MCP tool filters to non-system collections, which the
    REST operation exposes via the `excludeSystem` query parameter.
- tool: read-documents-with-filter
  category: read
  rest:
  - createAqlQueryCursor
  binding: rest
  confidence: medium
  note: >-
    No REST "filter documents" operation exists. The tool composes an AQL
    FOR/FILTER/LIMIT query and submits it to POST /_api/cursor
    (createAqlQueryCursor); its limit/skip parameters map onto AQL LIMIT, not onto
    REST pagination parameters.
- tool: execute-aql-query
  category: query
  rest:
  - createAqlQueryCursor
  - getNextAqlQueryCursorBatchPut
  - deleteAqlQueryCursor
  binding: rest
  confidence: high
  note: >-
    POST /_api/cursor with `query` + `bindVars`; result batches beyond the first
    are fetched with PUT /_api/cursor/{cursor-identifier} and the cursor is
    released with DELETE /_api/cursor/{cursor-identifier}.
mcp_only:
- tool: get-aql-manual
  reason: >-
