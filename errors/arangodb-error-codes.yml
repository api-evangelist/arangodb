format: arangodb-errornum
description: 'ArangoDB''s first-party error registry. Every error reply from an ArangoDB server carries
  an HTTP status in `code`, `error: true`, an ArangoDB-specific numeric `errorNum`, and a human-readable
  `errorMessage`. `errorNum` is the stable identifier clients should branch on; the message text can vary
  for the same error kind. Harvested verbatim from lib/Basics/errors.dat in the arangodb/arangodb source
  tree at tag v3.12.10, which is the same source the documentation''s error-codes page is generated from.'
envelope:
  media_type: application/json
  fields:
  - field: error
    type: boolean
    note: always true on an error reply
  - field: code
    type: integer
    note: HTTP status code, repeated in the body
  - field: errorNum
    type: integer
    note: ArangoDB error number — the stable identifier
  - field: errorMessage
    type: string
    note: human-readable message; may be overridden with more detail
  example: '{"code":401,"error":true,"errorNum":11,"errorMessage":"not authorized to execute this request"}'
